name: Build harry_UNU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build harry_UNU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ARM SDK
        id: arm-sdk
        uses: actions/cache@v4
        with:
          # Keyed on tools.mk so the cached toolchain tracks the version this
          # branch installs (release_7_00 pins gcc-arm-none-eabi-7-2018-q2-update,
          # master pins arm-gnu-toolchain-14.3.rel1).
          path: tools/
          key: arm-sdk-${{ hashFiles('make/tools.mk') }}

      - name: Install ARM SDK
        if: steps.arm-sdk.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Build firmware
        run: make fw_harry_UNU -j"$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harry_UNU
          path: |
            build/harry_UNU/harry_UNU.bin
            build/harry_UNU/harry_UNU.hex
            build/harry_UNU/harry_UNU.elf
